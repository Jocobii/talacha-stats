name: Security Scan

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    # Escaneo proactivo todos los lunes a las 8am UTC
    # Detecta CVEs nuevos en deps que no tocaste esa semana
    - cron: '0 8 * * 1'

jobs:
  trivy:
    name: Trivy — filesystem & dependency scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # requerido para subir resultados a la pestaña Security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Paso 1: Tabla legible en los logs ───────────────────────────────────
      # Corre primero sin fallar para que el dev vea exactamente qué encontró
      # ANTES de que el pipeline falle. La salida aparece en los logs del paso
      # con formato de tabla: Package | CVE | Severity | Installed | Fixed.
      - name: Show vulnerabilities (human-readable)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'              # no falla aquí — solo muestra
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          scanners: 'vuln,secret,misconfig'

      # ── Paso 2: Job Summary con detalle accionable ──────────────────────────
      # Genera un resumen en Markdown visible directo en la página del workflow
      # (pestaña "Summary"). El dev ve qué falló sin tener que abrir los logs.
      - name: Generate Job Summary
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'template'
          template: '@/contrib/github.tpl'
          output: 'trivy-summary.md'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          scanners: 'vuln,secret,misconfig'

      - name: Publish to GitHub Job Summary
        if: always()
        run: |
          echo "## 🔒 Security Scan — Trivy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Severidades escaneadas:** CRITICAL, HIGH (con fix disponible)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -s trivy-summary.md ]; then
            cat trivy-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Sin vulnerabilidades CRITICAL o HIGH encontradas.**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📋 Detalle completo → pestaña **Security → Code scanning alerts**" >> $GITHUB_STEP_SUMMARY
          echo "📄 CVEs suprimidos justificados → \`.trivyignore\`" >> $GITHUB_STEP_SUMMARY

      # ── Paso 3: SARIF para GitHub Security tab ──────────────────────────────
      # Genera el archivo SARIF y falla el pipeline si hay CRITICAL o HIGH.
      # Se ejecuta después de mostrar la info al dev — así el error tiene contexto.
      - name: Run Trivy — generate SARIF and enforce
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'              # ← aquí falla si encontró algo
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          scanners: 'vuln,secret,misconfig'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ── Escaneo completo semanal (MEDIUM incluido, sin bloquear pipeline) ───────
  # Solo corre en el schedule — no en PRs ni push
  trivy-full:
    name: Trivy — full scan (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show all vulnerabilities (human-readable)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: false
          trivyignores: '.trivyignore'
          scanners: 'vuln,secret,misconfig'

      - name: Generate full SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-full-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'          # no bloquea — solo reporta
          ignore-unfixed: false   # incluye CVEs sin fix para tener visibilidad completa
          trivyignores: '.trivyignore'
          scanners: 'vuln,secret,misconfig'

      - name: Weekly summary
        if: always()
        run: |
          echo "## 🔒 Weekly Security Scan — Trivy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Severidades:** CRITICAL, HIGH, MEDIUM (incluyendo sin fix disponible)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Revisa la pestaña **Security → Code scanning alerts** para el detalle completo." >> $GITHUB_STEP_SUMMARY

      - name: Upload full SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-full-results.sarif'
